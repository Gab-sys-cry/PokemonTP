spring.application.name=pokemon-management-api
# --- SQL Server Express : base réelle de l'application ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=pokemondb;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=Azerty31!
# Hibernate crée/met à jour les tables dans SQL Server, sans jamais les supprimer
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
# Aucun script SQL exécuté automatiquement sur la vraie base
spring.sql.init.mode=never